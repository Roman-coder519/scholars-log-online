              schema:
                $ref: "#/components/schemas/PrayerTimes"

  /dashboard/week:
    get:
      operationId: getWeekSummary
      tags: [dashboard]
      summary: Get this week's task and habit summary
      responses:
        "200":
          description: Week summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekSummary"

  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [tasks]
      summary: List focus sessions
      responses:
        "200":
          description: List of focus sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
    post:
      operationId: createFocusSession
      tags: [tasks]
      summary: Record a completed focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFocusSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
