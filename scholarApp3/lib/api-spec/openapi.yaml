      operationId: checkBadges
      tags: [badges]
      summary: Check and award any newly earned badges
      responses:
        "200":
          description: Newly earned badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /transactions:
    get:
      operationId: listTransactions
      tags: [accounts]
      summary: List transactions with optional filters
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: month
          in: query
          schema:
            type: string
            description: Filter by month (YYYY-MM)
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [accounts]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/summary:
    get:
      operationId: getTransactionsSummary
      tags: [accounts]
      summary: Get income/expense summary by month and category
      parameters:
        - name: months
          in: query
          schema:
            type: integer
            description: Number of past months to include (default 6)
      responses:
        "200":
          description: Transactions summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsSummary"

  /transactions/{id}:
    put:
      operationId: updateTransaction
      tags: [accounts]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: deleteTransaction
      tags: [accounts]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /badges/{type}/seen:
    post:
      operationId: markBadgeSeen
      tags: [badges]
      summary: Mark a badge notification as seen
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [pending, in_progress, completed]
        dueDate:
          type: string
          nullable: true
          description: Date (YYYY-MM-DD)
        scheduledTime:
          type: string
          nullable: true
          description: Time (HH:MM)
        estimatedMinutes:
          type: integer
          nullable: true
        createdAt:
          type: string
      required: [id, title, priority, status, createdAt]

    CreateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [pending, in_progress, completed]
        dueDate:
          type: string
          nullable: true
        scheduledTime:
          type: string
          nullable: true
        estimatedMinutes:
          type: integer
          nullable: true
      required: [title, priority, status]

    UpdateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [pending, in_progress, completed]
        dueDate:
          type: string
          nullable: true
        scheduledTime:
          type: string
          nullable: true
        estimatedMinutes:
          type: integer
          nullable: true

    Habit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        frequency:
          type: string
          enum: [daily, weekly]
        targetDays:
          type: integer
          description: Number of days per week (for weekly habits)
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        createdAt:
          type: string
      required: [id, name, frequency, targetDays, currentStreak, longestStreak, createdAt]

    HabitWithStatus:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        frequency:
          type: string
          enum: [daily, weekly]
        targetDays:
          type: integer
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedToday:
          type: boolean
        createdAt:
          type: string
